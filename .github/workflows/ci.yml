name: SmartHub AgroChain CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'fix/**' ]
  pull_request:
# Safe, intentionally unreachable placeholder for Prisma client initialization and
# Next.js build-time route discovery. Never use Production DATABASE_URL in CI.
env:
  DATABASE_URL: "postgresql://smarthub_ci:placeholder@127.0.0.1:5432/smarthub_ci"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Phase 0-A security changes (fail closed)
        run: npx eslint src/app/api/kyc/verify/route.ts __tests__/security/p0a-kyc-admin-authorization.test.ts

      - name: Execute Vitest unit and integration tests (fail closed)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build

  # P0-A security gate. The existing legacy build job masks test failures;
  # this separate job must fail if unauthorized KYC mutations regress.
  p0a-kyc-security:
    name: KYC admin authorization (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run KYC authorization regression suite
        run: npx vitest run __tests__/security/p0a-kyc-admin-authorization.test.ts

  p0b-revocable-sessions:
    name: Database-backed session security (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint session migration files (fail closed)
        run: npx eslint src/middleware.ts src/lib/session.ts src/app/api/auth/login/route.ts src/app/api/auth/register/route.ts __tests__/security/p0b-revocable-realm-sessions.test.ts __tests__/security/p0b-auth-flow-regression.test.ts

      - name: Run session and auth regression suites
        run: npx vitest run __tests__/security/p0b-revocable-realm-sessions.test.ts __tests__/security/p0b-auth-flow-regression.test.ts

  p0c-origin-security:
    name: Admin and wallet CSRF origin policy (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint new origin policy and regression tests
        run: npx eslint src/lib/csrf.ts __tests__/security/p0c-origin-validation.test.ts __tests__/security/p0c-admin-mutation-guards.test.ts __tests__/security/p0c-wallet-withdraw-origin.test.ts

      - name: Run origin and admin mutation regression tests
        run: npx vitest run __tests__/security/p0c-origin-validation.test.ts __tests__/security/p0c-admin-mutation-guards.test.ts __tests__/security/p0c-wallet-withdraw-origin.test.ts

  p0c2-farmer-buyer-security:
    name: Farmer Buyer password and mutation protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint password security and tests
        run: npx eslint src/app/api/user/password/route.ts __tests__/security/p0c2-password-change.test.ts __tests__/security/p0c2-role-mutation-guards.test.ts

      - name: Run password and origin tests
        run: npx vitest run __tests__/security/p0c2-password-change.test.ts __tests__/security/p0c2-role-mutation-guards.test.ts __tests__/security/p0c-origin-validation.test.ts __tests__/security/p0c-wallet-withdraw-origin.test.ts

  p0c3-financial-endpoint-security:
    name: Financial endpoint authorization and ledger invariants (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint financial security implementation and tests
        run: npx eslint src/app/api/payments/flutterwave/initialize/route.ts src/app/api/payments/flutterwave/webhook/route.ts src/app/api/payments/flutterwave/verify/route.ts src/app/api/wallet/escrow/route.ts 'src/app/api/orders/[id]/release-escrow/route.ts' 'src/app/api/payments/settlement/[orderId]/route.ts' src/app/api/wallet/withdraw/route.ts src/services/wallet.service.ts src/services/payment.service.ts src/services/admin-order.service.ts src/jobs/index.ts src/lib/events.ts src/components/dashboard/wallet/TransferTab.tsx src/components/farmer/wallet/FarmerWithdrawModal.tsx __tests__/security/p0c3-financial-endpoint-security.test.ts __tests__/security/p0c3-admin-financial-actions.test.ts __tests__/security/p0c3-withdrawal-idempotency.test.ts __tests__/integration/auto-complete-escrow-release.test.ts

      - name: Run financial authorization and ledger regression suites
        run: npx vitest run __tests__/security/p0c3-financial-endpoint-security.test.ts __tests__/integration/multi-vendor-settlement.test.ts __tests__/integration/wallet-consolidation.test.ts __tests__/integration/auto-complete-escrow-release.test.ts __tests__/security/p0c3-admin-financial-actions.test.ts __tests__/security/p0c3-withdrawal-idempotency.test.ts
