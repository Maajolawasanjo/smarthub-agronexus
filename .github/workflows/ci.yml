name: SmartHub AgroChain CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linting
        run: npm run lint || true

      - name: Execute Domain Unit Tests
        run: npx jest || npx vitest run || true

      - name: Build Next.js Production App
        run: npm run build

  # P0-A security gate. The existing legacy build job masks test failures;
  # this separate job must fail if unauthorized KYC mutations regress.
  p0a-kyc-security:
    name: KYC admin authorization (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run KYC authorization regression suite
        run: npx vitest run __tests__/security/p0a-kyc-admin-authorization.test.ts
