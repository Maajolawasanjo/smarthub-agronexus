name: SmartHub AgroChain CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
# Safe, intentionally unreachable placeholder for Prisma client initialization and
# Next.js build-time route discovery. Never use Production DATABASE_URL in CI.
env:
  DATABASE_URL: "postgresql://smarthub_ci:placeholder@127.0.0.1:5432/smarthub_ci"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Phase 0-A security changes (fail closed)
        run: npx eslint src/app/api/kyc/verify/route.ts __tests__/security/p0a-kyc-admin-authorization.test.ts

      - name: Execute Vitest unit and integration tests (fail closed)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build

  # P0-A security gate. The existing legacy build job masks test failures;
  # this separate job must fail if unauthorized KYC mutations regress.
  p0a-kyc-security:
    name: KYC admin authorization (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run KYC authorization regression suite
        run: npx vitest run __tests__/security/p0a-kyc-admin-authorization.test.ts

  p0b-revocable-sessions:
    name: Database-backed session security (required verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint session migration files (fail closed)
        run: npx eslint src/lib/session.ts src/app/api/auth/login/route.ts src/app/api/auth/register/route.ts __tests__/security/p0b-revocable-realm-sessions.test.ts __tests__/security/p0b-auth-flow-regression.test.ts

      - name: Run session and auth regression suites
        run: npx vitest run __tests__/security/p0b-revocable-realm-sessions.test.ts __tests__/security/p0b-auth-flow-regression.test.ts
