openapi: 3.0.3
info:
  title: SmartHub AgroChain Platform API
  description: Enterprise REST API specification for SmartHub AgroChain — Agricultural Marketplace, Financial Settlement, and Escrow Platform.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local Development Environment
  - url: https://api.smarthub-agrochain.com/api
    description: Production Environment

paths:
  /health:
    get:
      summary: Health Check Endpoint
      description: Returns real-time system and database health diagnostics.
      responses:
        '200':
          description: System is fully operational (UP).
        '503':
          description: Service degraded or database unavailable.

  /metrics:
    get:
      summary: Prometheus Telemetry Metrics
      description: Exposes Prometheus-compatible CPU, memory, and event counter metrics.
      responses:
        '200':
          description: Plaintext Prometheus metrics text representation.

  /notifications:
    get:
      summary: Hydrate Notifications Page DTO
      description: Returns single-query NotificationPageDTO including unread counts and categories.
      responses:
        '200':
          description: Successfully retrieved NotificationPageDTO.
        '401':
          description: Unauthorized. Session token missing or expired.

  /fulfillment/{orderId}:
    get:
      summary: Order Fulfillment State & DTO
      description: Retrieves complete fulfillment state, tracking timeline, and allowed role actions.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order FulfillmentDTO retrieved successfully.
        '404':
          description: Order not found.

  /payments/webhook:
    post:
      summary: Idempotent Payment Settlement Webhook
      description: Handles payment gateway callbacks, executes fee split, releases escrow, and emits PAYMENT_COMPLETED event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionRef:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: Payment processed idempotently.
        '400':
          description: Invalid signature or missing transactionRef.
